<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>定位相機</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000; --fg: #f5f5f7; --muted: #8e8e93;
    --glass: rgba(30, 30, 32, .55); --glass-line: rgba(255, 255, 255, .12);
    --stamp: #e5482f; --accent: #ffd60a; --ok: #30d158; --warn: #ffd60a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "SF Pro Text", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; overflow: hidden; touch-action: none; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { position: relative; height: 100%; display: flex; flex-direction: column; }
  .viewer { position: relative; flex: 1; overflow: hidden; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    transform-origin: center; }

  /* 取景範圍：跟照片一樣大的框，浮水印預覽畫在裡面 */
  .shot-rect { position: absolute; pointer-events: none; overflow: hidden; }
  .frame { position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
    transform: translate(-50%, -50%); }
  .frame.cw  { width: var(--rh); height: var(--rw); transform: translate(-50%, -50%) rotate(90deg); }
  .frame.ccw { width: var(--rh); height: var(--rw); transform: translate(-50%, -50%) rotate(-90deg); }
  .stamp { position: absolute; color: var(--stamp); font-weight: 600; line-height: 1.3;
    white-space: pre; font-family: -apple-system, "PingFang TC", sans-serif; }

  .flash { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  .flash.on { animation: blink .18s ease-out; }
  @keyframes blink { 0% { opacity: .9 } 100% { opacity: 0 } }

  .pill { background: var(--glass); border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
    border-radius: 999px; }
  .gps { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    padding: 6px 12px 6px 10px; font-size: 13px; font-weight: 500; white-space: nowrap;
    display: flex; align-items: center; gap: 7px; }
  .gps .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
  .gps.ok .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }

  .zoom-readout { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    padding: 8px 16px; font: 600 20px/1 inherit; font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity .25s; pointer-events: none; }
  .zoom-readout.show { opacity: 1; }

  .zooms { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 4px; }
  .zooms button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent;
    font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--fg); }
  .zooms button.on { background: rgba(0,0,0,.45); color: var(--accent); font-size: 13px; }

  .toast { position: absolute; left: 50%; top: 52px; transform: translateX(-50%);
    padding: 8px 14px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .msg { position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    padding: 2rem; color: var(--muted); line-height: 1.6; }

  .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 18px 28px 22px; }
  .thumb { width: 46px; height: 46px; border-radius: 10px; border: 1.5px solid rgba(255,255,255,.85);
    background: #1c1c1e center/cover no-repeat; justify-self: start; position: relative; transition: transform .2s; }
  .thumb.pop { transform: scale(1.12); }
  .thumb .badge { position: absolute; top: -7px; right: -9px; min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: 10px; background: var(--stamp); color: #fff; font-size: 11px; font-weight: 700;
    display: none; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .shutter { width: 76px; height: 76px; border-radius: 50%; border: 0; padding: 0; background: transparent;
    position: relative; }
  .shutter::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 4px solid #fff; }
  .shutter::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: #fff;
    transition: transform .12s, background .12s; }
  .shutter:active::after { transform: scale(.88); background: #d8d8d8; }
  .spacer { justify-self: end; width: 46px; }

  .start { position: absolute; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.6);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .start-card { text-align: center; }
  .start-card button { border: 0; border-radius: 999px; padding: 14px 34px; font-size: 17px; font-weight: 600;
    background: #fff; color: #000; }
  .start-card p { margin: 12px 0 0; font-size: 13px; color: var(--muted); }
  canvas { display: none; }

  @media (orientation: landscape) {
    .app { flex-direction: row; }
    .viewer { margin-left: env(safe-area-inset-left, 0px); }
    .bar { grid-template-columns: 1fr; grid-template-rows: 1fr auto 1fr; justify-items: center;
      padding: 16px calc(18px + env(safe-area-inset-right, 0px)) 16px 18px; }
    .thumb { justify-self: center; align-self: end; grid-row: 3; }
    .shutter { grid-row: 2; }
    .spacer { display: none; }
    .zooms { bottom: auto; left: auto; right: 12px; top: 50%; transform: translateY(-50%); flex-direction: column; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="viewer" id="viewer">
    <video id="video" playsinline autoplay muted></video>
    <div id="shotRect" class="shot-rect">
      <div id="frame" class="frame"><div id="stamp" class="stamp"></div></div>
    </div>
    <div id="flash" class="flash"></div>
    <div id="gps" class="gps pill"><span class="dot"></span><span id="gpsText">定位中…</span></div>
    <div id="toast" class="toast pill"></div>
    <div id="zoomReadout" class="zoom-readout pill">1.0×</div>
    <div id="zooms" class="zooms pill"></div>
    <div id="msg" class="msg"></div>
    <div id="start" class="start">
      <div class="start-card">
        <button id="startBtn">開始拍照</button>
        <p>需要偵測手機方向，才能判斷橫拍或直拍</p>
      </div>
    </div>
  </div>
  <div class="bar">
    <div id="thumb" class="thumb" aria-label="最新一張"><span id="badge" class="badge"></span></div>
    <button id="shutter" class="shutter" aria-label="拍照"></button>
    <span class="spacer"></span>
  </div>
</div>
<canvas id="canvas"></canvas>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('canvas');
const params = new URLSearchParams(location.search);
const FLIP = params.has('flip');
const COLOR = '#e5482f';
const SIZE = 0.045;

// ---------- 定位 ----------
let pos = null; // { lat, lng, acc, t }
function startGPS() {
  if (window.__inScriptable) return; // 在 Scriptable 裡由它負責定位
  if (!navigator.geolocation) { $('gpsText').textContent = '這裡不支援定位'; return; }
  navigator.geolocation.watchPosition(p => {
    pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
  }, err => {
    $('gpsText').textContent = err.code === 1 ? '沒有定位權限' : '定位訊號弱';
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
setInterval(() => {
  if (!pos) return;
  const age = (Date.now() - pos.t) / 1000;
  $('gps').classList.toggle('ok', age < 6);
  $('gpsText').textContent = age < 6 ? `GPS ±${Math.round(pos.acc)} 公尺` : `位置 ${Math.round(age)} 秒沒更新`;
}, 500);

// ---------- 手機方向 ----------
let gravity = null;
window.addEventListener('devicemotion', e => { gravity = e.accelerationIncludingGravity; });
function deviceTurn() {
  if (!gravity || gravity.x == null) return 'portrait';
  const x = gravity.x, y = gravity.y;
  if (Math.abs(x) < Math.abs(y) + 2) return 'portrait';
  let t = x > 0 ? 'cw' : 'ccw';
  if (FLIP) t = t === 'cw' ? 'ccw' : 'cw';
  return t;
}
const windowLandscape = () => innerWidth > innerHeight;

// ---------- 縮放 ----------
let track = null, hwZoom = false, zMin = 1, zMax = 5, zoom = 1, zoomTimer, readoutTimer;
function setupZoom() {
  const caps = track && track.getCapabilities ? track.getCapabilities() : {};
  if (caps.zoom && caps.zoom.max > caps.zoom.min) {
    hwZoom = true; zMin = caps.zoom.min; zMax = Math.min(caps.zoom.max, 10);
  } else {
    hwZoom = false; zMin = 1; zMax = 5;
  }
  zoom = Math.max(zMin, 1);
  const presets = [zMin < 1 ? zMin : null, 1, 2, 3, 5].filter(v => v != null && v >= zMin && v <= zMax);
  $('zooms').innerHTML = '';
  [...new Set(presets)].forEach(v => {
    const b = document.createElement('button');
    b.dataset.z = v; b.onclick = () => setZoom(v, true);
    $('zooms').appendChild(b);
  });
  renderZoomButtons();
}
function fmt(z) { return (Math.round(z * 10) / 10).toString().replace(/\.0$/, ''); }
function renderZoomButtons() {
  const btns = [...$('zooms').children];
  let active = null;
  btns.forEach(b => { if (+b.dataset.z <= zoom + 0.05) active = b; });
  btns.forEach(b => {
    const on = b === active;
    b.classList.toggle('on', on);
    b.textContent = on ? fmt(zoom) + '×' : fmt(+b.dataset.z);
  });
}
function setZoom(z, showReadout) {
  zoom = Math.min(zMax, Math.max(zMin, z));
  if (hwZoom) {
    clearTimeout(zoomTimer);
    zoomTimer = setTimeout(() => track.applyConstraints({ advanced: [{ zoom }] }).catch(() => {}), 30);
    video.style.transform = '';
  } else {
    video.style.transform = `scale(${zoom})`;
  }
  renderZoomButtons();
  if (showReadout) {
    $('zoomReadout').textContent = fmt(zoom) + '×';
    $('zoomReadout').classList.add('show');
    clearTimeout(readoutTimer);
    readoutTimer = setTimeout(() => $('zoomReadout').classList.remove('show'), 700);
  }
}
// 雙指捏合縮放
let pinchStart = null;
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
$('viewer').addEventListener('touchstart', e => {
  if (e.touches.length === 2) pinchStart = { d: dist(e.touches), z: zoom };
}, { passive: true });
$('viewer').addEventListener('touchmove', e => {
  if (pinchStart && e.touches.length === 2) setZoom(pinchStart.z * dist(e.touches) / pinchStart.d, true);
}, { passive: true });
$('viewer').addEventListener('touchend', e => { if (e.touches.length < 2) pinchStart = null; });

// ---------- 浮水印 ----------
const pad = n => String(n).padStart(2, '0');
function stampLines(d) {
  return [
    '緯度:' + (pos ? pos.lat.toFixed(6) : '定位中'),
    '經度:' + (pos ? pos.lng.toFixed(6) : '定位中'),
    '時間:' + `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
  ];
}
// 算出影片在畫面上實際顯示的範圍（就是照片的範圍）
function updatePreview() {
  const v = $('viewer'), W = v.clientWidth, H = v.clientHeight;
  const vw = video.videoWidth || 3, vh = video.videoHeight || 4;
  const s = Math.min(W / vw, H / vh);
  const rw = vw * s, rh = vh * s;
  const r = $('shotRect');
  r.style.width = rw + 'px'; r.style.height = rh + 'px';
  r.style.left = (W - rw) / 2 + 'px'; r.style.top = (H - rh) / 2 + 'px';
  $('frame').style.setProperty('--rw', rw + 'px');
  $('frame').style.setProperty('--rh', rh + 'px');

  const turn = windowLandscape() ? 'portrait' : deviceTurn();
  $('frame').className = 'frame' + (turn === 'portrait' ? '' : ' ' + turn);
  const size = Math.min(rw, rh) * SIZE;
  const st = $('stamp');
  st.style.fontSize = size + 'px';
  st.style.left = size * 0.15 + 'px';
  st.style.bottom = size * 0.2 + 'px';
  st.textContent = stampLines(new Date()).join('\n');
}
setInterval(updatePreview, 200);
addEventListener('resize', updatePreview);

// ---------- 相機 ----------
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 4032 }, height: { ideal: 3024 } }, audio: false });
    video.srcObject = stream;
    track = stream.getVideoTracks()[0];
    video.onloadedmetadata = () => { setupZoom(); updatePreview(); };
  } catch (e) {
    $('msg').style.display = 'grid';
    $('msg').textContent = '相機打不開（' + (e.name || e) + '）';
  }
}

// ---------- 拍照 ----------
function capture() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return null;
  // 數位縮放：裁切中間
  const z = hwZoom ? 1 : zoom;
  const sw = vw / z, sh = vh / z, sx = (vw - sw) / 2, sy = (vh - sh) / 2;

  const frameLandscape = vw > vh;
  const turn = deviceTurn();
  const wantLandscape = turn !== 'portrait' || windowLandscape();
  let rotate = null;
  if (wantLandscape !== frameLandscape) rotate = turn === 'portrait' ? 'cw' : turn;

  const w = rotate ? vh : vw, h = rotate ? vw : vh;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.save();
  if (rotate === 'cw') { ctx.translate(w, 0); ctx.rotate(Math.PI / 2); }
  if (rotate === 'ccw') { ctx.translate(0, h); ctx.rotate(-Math.PI / 2); }
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, vw, vh);
  ctx.restore();

  const lines = stampLines(new Date());
  const size = Math.round(Math.min(w, h) * SIZE);
  const lineH = Math.round(size * 1.3);
  const left = Math.round(size * 0.15), bottom = Math.round(size * 0.2);
  ctx.font = `600 ${size}px -apple-system, "PingFang TC", sans-serif`;
  ctx.fillStyle = COLOR; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  const startY = h - bottom - lineH * lines.length;
  lines.forEach((t, i) => ctx.fillText(t, left, startY + i * lineH + (lineH - size) / 2));
  return canvas.toDataURL('image/jpeg', 0.92);
}

// ---------- 和 Scriptable 溝通 ----------
let inScriptable = false, pendingCb = null;
const queue = [];
window.__scRegister = cb => { inScriptable = true; if (queue.length) cb(queue.shift()); else pendingCb = cb; };
window.__scTake = () => { inScriptable = true; return queue.length ? queue.shift() : ''; };
window.__scSaved = n => {
  const b = $('badge'); b.textContent = n; b.style.display = 'flex';
  toast('已存入相簿');
};
window.__scError = m => toast('存檔失敗：' + m);
window.__scLoc = (lat, lng, acc) => { pos = { lat, lng, acc: acc || 0, t: Date.now() }; };
window.__scLocErr = m => { if (!pos) $('gpsText').textContent = '定位失敗：' + m; };
window.__scLocStatus = m => { if (!pos) $('gpsText').textContent = m; };
function deliver(dataUrl) {
  if (pendingCb) { const c = pendingCb; pendingCb = null; c(dataUrl); } else queue.push(dataUrl);
}

async function shareSingle(dataUrl) {
  const blob = await (await fetch(dataUrl)).blob();
  const file = new File([blob], `IMG_${Date.now()}.jpg`, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch (e) {}
  }
}

let toastTimer;
function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1300);
}

$('shutter').onclick = () => {
  if (!pos) { toast('還在定位，請稍等'); return; }
  const data = capture(); if (!data) return;
  $('flash').classList.remove('on'); void $('flash').offsetWidth; $('flash').classList.add('on');
  const th = $('thumb');
  th.style.backgroundImage = `url(${data})`;
  th.classList.add('pop'); setTimeout(() => th.classList.remove('pop'), 200);
  if (inScriptable || window.__inScriptable) deliver(data); else shareSingle(data);
};

// ---------- 開始 ----------
async function begin() {
  $('start').style.display = 'none';
  try { if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission) await DeviceMotionEvent.requestPermission(); } catch (e) {}
  startGPS(); startCamera();
}
if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
  $('start').style.display = 'grid';
  $('startBtn').onclick = begin;
} else {
  begin();
}
</script>
</body>
</html>
